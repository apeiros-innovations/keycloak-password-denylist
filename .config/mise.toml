[tools]
node = "26.11.1"
"aqua:cli/cli" = "2.102.0"
"aqua:casey/just" = "1.58.0"
"aqua:google/yamlfmt" = "0.21.0"
"aqua:evilmartians/lefthook" = "2.2.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:carvel-dev/vendir" = "0.46.2"
"aqua:carvel-dev/imgpkg" = "0.48.3"
"aqua:oras-project/oras" = "1.3.4"
"aqua:mikefarah/yq" = "4.54.1"
"npm:cspell" = "10.3.6"
"npm:@commitlint/cli" = "21.2.3"
"npm:markdownlint-cli2" = "0.23.3"
"npm:oxfmt" = "0.72.0"
python = "3.14.7"
"aqua:astral-sh/uv" = "0.12.21"
"aqua:mvdan/sh" = "3.14.1"
"aqua:betterleaks/betterleaks" = "1.9.0"
"aqua:dotenv-linter/dotenv-linter" = "4.0.0"
"aqua:rhysd/actionlint" = "1.7.12"
"npm:@commitlint/config-conventional" = "21.2.3"

[tools."pipx:yamllint"]
version = "1.38.0"
depends = ["python", "aqua:astral-sh/uv"]
[hooks]
postinstall = "if [ -z \"${CI:-}\" ] && command -v lefthook >/dev/null 2>&1; then lefthook install; fi"

[min_version]
hard = "2026.8.12"

[settings]
lockfile = true
experimental = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
