---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish OCI image

on:
  push:
    branches:
      - main
    paths:
      - vendir.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LC_ALL: C
  ROOTFS_DIRECTORY: dist/rootfs
  PASSWORD_FILE: dist/rootfs/xato-net-10-million-passwords-1000000.txt

jobs:
  publish:
    name: Publish OCI artifact
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false
          github_token: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Synchronize vendir content
        env:
          VENDIR_GITHUB_API_TOKEN: ${{ github.token }}
        run: vendir sync

      - name: Normalize file permissions
        run: chmod 0644 "${PASSWORD_FILE}"

      - name: Prepare publication
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          SOURCE_REF="$(
            yq -er '
              [
                .directories[].contents[].githubRelease |
                select(.slug == "danielmiessler/SecLists") |
                .tag
              ][0]
            ' vendir.yml
          )"

          if [[ ! "${SOURCE_REF}" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
            printf 'Invalid SecLists release tag: %s\n' \
              "${SOURCE_REF:-not-found}" >&2
            exit 1
          fi

          ARTIFACT_REPOSITORY="ghcr.io/${REPOSITORY,,}"
          ARTIFACT="${ARTIFACT_REPOSITORY}:${SOURCE_REF}"

          if oras resolve "${ARTIFACT}" >/dev/null 2>&1; then
            printf 'Refusing to overwrite existing artifact: %s\n' \
              "${ARTIFACT}" >&2
            exit 1
          fi

          STAGING_TAG="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            printf 'repository=%s\n' "${ARTIFACT_REPOSITORY}"
            printf 'source-ref=%s\n' "${SOURCE_REF}"
            printf 'staging-reference=%s:%s\n' \
              "${ARTIFACT_REPOSITORY}" "${STAGING_TAG}"
            printf 'tag=%s\n' "${SOURCE_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Push staged OCI image
        id: push
        env:
          ARTIFACT_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_REVISION: ${{ github.sha }}
          PACKAGE_SOURCE: https://github.com/${{ github.repository }}
          SOURCE_REF: ${{ steps.release.outputs.source-ref }}
          STAGING_REFERENCE: ${{ steps.release.outputs.staging-reference }}
        run: |
          FILE_SHA256="$(
            sha256sum "${PASSWORD_FILE}" |
              awk '{print $1}'
          )"

          imgpkg push \
            --yes \
            --image "${STAGING_REFERENCE}" \
            --file "${ROOTFS_DIRECTORY}" \
            --preserve-permissions \
            --labels "org.opencontainers.image.title=keycloak-password-denylist" \
            --labels "org.opencontainers.image.description=Password denylist data for Keycloak" \
            --labels "org.opencontainers.image.source=${PACKAGE_SOURCE}" \
            --labels "org.opencontainers.image.revision=${PACKAGE_REVISION}" \
            --labels "org.opencontainers.image.version=${ARTIFACT_TAG}" \
            --labels "org.opencontainers.image.licenses=MIT"

          DIGEST="$(oras resolve "${STAGING_REFERENCE}")"

          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'Registry returned an invalid digest: %s\n' \
              "${DIGEST}" >&2
            exit 1
          fi

          DIGEST_REFERENCE="${STAGING_REFERENCE%:*}@${DIGEST}"

          {
            printf 'digest=%s\n' "${DIGEST}"
            printf 'reference=%s\n' "${DIGEST_REFERENCE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign OCI image
        env:
          DIGEST_REFERENCE: ${{ steps.push.outputs.reference }}
        run: cosign sign --yes "${DIGEST_REFERENCE}"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify OCI signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          DIGEST_REFERENCE: ${{ steps.push.outputs.reference }}
        run: |
          cosign verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            "${DIGEST_REFERENCE}"

      - name: Publish OCI tag without overwrite
        env:
          ARTIFACT_REPOSITORY: ${{ steps.release.outputs.repository }}
          ARTIFACT_TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ARTIFACT="${ARTIFACT_REPOSITORY}:${ARTIFACT_TAG}"

          if oras resolve "${ARTIFACT}" >/dev/null 2>&1; then
            printf 'Refusing to overwrite existing artifact: %s\n' \
              "${ARTIFACT}" >&2
            exit 1
          fi

          oras tag \
            "${ARTIFACT_REPOSITORY}@${DIGEST}" \
            "${ARTIFACT_TAG}"

          PUBLISHED_DIGEST="$(oras resolve "${ARTIFACT}")"

          if [[ "${PUBLISHED_DIGEST}" != "${DIGEST}" ]]; then
            printf 'Published tag resolved to %s; expected %s\n' \
              "${PUBLISHED_DIGEST}" "${DIGEST}" >&2
            exit 1
          fi

      - name: Write publication summary
        if: ${{ always() }}
        env:
          ARTIFACT_REPOSITORY: ${{ steps.release.outputs.repository }}
          ARTIFACT_TAG: ${{ steps.release.outputs.tag }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SOURCE_REF: ${{ steps.release.outputs.source-ref }}
        run: |
          {
            printf '## Keycloak password denylist\n\n'
            printf -- '- SecLists release: `%s`\n' \
              "${SOURCE_REF:-not-resolved}"
            printf -- '- Artifact: `%s:%s`\n' \
              "${ARTIFACT_REPOSITORY}" "${ARTIFACT_TAG}"
            printf -- '- Digest: `%s`\n' \
              "${DIGEST:-not-published}"
            printf -- '- Digest-pinned reference: `%s@%s`\n' \
              "${ARTIFACT_REPOSITORY}" "${DIGEST:-not-published}"
            printf -- '- Signer: `%s`\n' \
              "${CERTIFICATE_IDENTITY}"
            printf -- '- Issuer: `%s`\n' \
              'https://token.actions.githubusercontent.com'
            printf -- '- Provenance: %s\n' \
              "${ATTESTATION_URL:-not-created}"
            printf -- '- Mounted file: `%s/%s`\n' \
              '/opt/keycloak/data/password-blacklists' \
              "${PASSWORD_FILE##*/}"
            printf -- '- Keycloak policy: `passwordBlacklist(%s)`\n' \
              "${PASSWORD_FILE##*/}"
          } >> "${GITHUB_STEP_SUMMARY}"
