---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish OCI image

on:
  push:
    branches:
      - main
    paths:
      - vendir.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LC_ALL: C
  ROOTFS_DIRECTORY: dist/rootfs
  PASSWORD_FILE: dist/rootfs/xato-net-10-million-passwords-1000000.txt

jobs:
  publish:
    name: Publish OCI artifact
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.11
          cache: false
          github_token: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Synchronize vendir content
        env:
          VENDIR_GITHUB_API_TOKEN: ${{ github.token }}
        run: vendir sync

      - name: Normalize file permissions
        run: chmod 0644 "${PASSWORD_FILE}"

      - name: Prepare publication
        id: publication
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          SOURCE_REF="$(
            yq -er '
              [
                .directories[].contents[].githubRelease |
                select(.slug == "danielmiessler/SecLists") |
                .tag
              ][0]
            ' vendir.yml
          )"

          if [[ ! "${SOURCE_REF}" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
            printf 'Invalid SecLists release tag: %s\n' \
              "${SOURCE_REF:-not-found}" >&2
            exit 1
          fi

          ARTIFACT_REPOSITORY="ghcr.io/${REPOSITORY,,}"

          {
            printf 'reference=%s:%s\n' \
              "${ARTIFACT_REPOSITORY}" "${SOURCE_REF}"
            printf 'repository=%s\n' "${ARTIFACT_REPOSITORY}"
            printf 'source-ref=%s\n' "${SOURCE_REF}"
            printf 'tag=%s\n' "${SOURCE_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Push OCI image
        env:
          ARTIFACT_REFERENCE: ${{ steps.publication.outputs.reference }}
          ARTIFACT_TAG: ${{ steps.publication.outputs.tag }}
          PACKAGE_REVISION: ${{ github.sha }}
          PACKAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          imgpkg push \
            --yes \
            --image "${ARTIFACT_REFERENCE}" \
            --file "${ROOTFS_DIRECTORY}" \
            --preserve-permissions \
            --labels "org.opencontainers.image.title=keycloak-password-denylist" \
            --labels "org.opencontainers.image.description=Password denylist data for Keycloak" \
            --labels "org.opencontainers.image.source=${PACKAGE_SOURCE}" \
            --labels "org.opencontainers.image.revision=${PACKAGE_REVISION}" \
            --labels "org.opencontainers.image.version=${ARTIFACT_TAG}" \
            --labels "org.opencontainers.image.licenses=MIT"

      - name: Resolve OCI image
        id: image
        env:
          ARTIFACT_REFERENCE: ${{ steps.publication.outputs.reference }}
          ARTIFACT_REPOSITORY: ${{ steps.publication.outputs.repository }}
        run: |
          DIGEST="$(oras resolve "${ARTIFACT_REFERENCE}")"

          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'Registry returned an invalid digest: %s\n' \
              "${DIGEST}" >&2
            exit 1
          fi

          {
            printf 'digest=%s\n' "${DIGEST}"
            printf 'reference=%s@%s\n' \
              "${ARTIFACT_REPOSITORY}" "${DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign OCI image
        env:
          DIGEST_REFERENCE: ${{ steps.image.outputs.reference }}
        run: cosign sign --yes "${DIGEST_REFERENCE}"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ steps.publication.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify OCI signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          DIGEST_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          cosign verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            "${DIGEST_REFERENCE}"

      - name: Verify published tag
        env:
          ARTIFACT_REFERENCE: ${{ steps.publication.outputs.reference }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          PUBLISHED_DIGEST="$(oras resolve "${ARTIFACT_REFERENCE}")"

          if [[ "${PUBLISHED_DIGEST}" != "${EXPECTED_DIGEST}" ]]; then
            printf 'Published tag resolved to %s; expected %s\n' \
              "${PUBLISHED_DIGEST}" "${EXPECTED_DIGEST}" >&2
            exit 1
          fi

      - name: Write publication summary
        if: ${{ always() }}
        env:
          ARTIFACT_REFERENCE: ${{ steps.publication.outputs.reference }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          DIGEST: ${{ steps.image.outputs.digest }}
          DIGEST_REFERENCE: ${{ steps.image.outputs.reference }}
          SOURCE_REF: ${{ steps.publication.outputs.source-ref }}
        run: |
          {
            printf '## Keycloak password denylist\n\n'
            printf -- '- SecLists release: `%s`\n' \
              "${SOURCE_REF:-not-resolved}"
            printf -- '- Artifact: `%s`\n' \
              "${ARTIFACT_REFERENCE:-not-published}"
            printf -- '- Digest: `%s`\n' \
              "${DIGEST:-not-published}"
            printf -- '- Digest-pinned reference: `%s`\n' \
              "${DIGEST_REFERENCE:-not-published}"
            printf -- '- Signer: `%s`\n' \
              "${CERTIFICATE_IDENTITY}"
            printf -- '- Issuer: `%s`\n' \
              'https://token.actions.githubusercontent.com'
            printf -- '- Provenance: %s\n' \
              "${ATTESTATION_URL:-not-created}"
            printf -- '- Mounted file: `%s/%s`\n' \
              '/opt/keycloak/data/password-blacklists' \
              "${PASSWORD_FILE##*/}"
            printf -- '- Keycloak policy: `passwordBlacklist(%s)`\n' \
              "${PASSWORD_FILE##*/}"
          } >> "${GITHUB_STEP_SUMMARY}"
