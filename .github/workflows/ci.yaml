---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MISE_ENV: ci

jobs:
  sync:
    name: Synchronize vendir content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vendir
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        with:
          cache: false
          github_token: ${{ github.token }}

          add_shims_to_path: false
          install_args: --locked aqua:carvel-dev/vendir
      - name: Synchronize vendir content
        env:
          VENDIR_GITHUB_API_TOKEN: ${{ github.token }}
        run: vendir sync
