---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request: null
  push:
    branches:
      - main
  merge_group: null

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MISE_ENV: ci

jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sync: ${{ steps.baseline.outputs.full == 'true' || steps.filter.outputs.unclassified == 'true' || steps.filter.outputs['sync'] == 'true' }}
      workflow-lint: ${{ steps.baseline.outputs.full == 'true' || steps.filter.outputs.unclassified == 'true' || steps.filter.outputs['workflow-lint'] == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check comparison history
        id: baseline
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          NEW_BRANCH: ${{ github.event.created || false }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          full=true
          if [[ "$EVENT" == pull_request || "$EVENT" == push || "$EVENT" == merge_group ]] &&
             [[ "$NEW_BRANCH" != true && "$REF" != refs/tags/* ]] &&
             [[ "$BASE" =~ ^[[:xdigit:]]{40}$ && "$HEAD_SHA" =~ ^[[:xdigit:]]{40}$ ]] &&
             git cat-file -e "$BASE^{commit}" && git cat-file -e "$HEAD_SHA^{commit}"; then
            if [[ "$EVENT" == pull_request ]]; then
              if git merge-base "$BASE" "$HEAD_SHA" >/dev/null; then full=false; fi
            elif git merge-base --is-ancestor "$BASE" "$HEAD_SHA"; then
              full=false
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Detect changed paths
        id: filter
        if: steps.baseline.outputs.full == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          predicate-quantifier: some-with-excludes
          filters: .github/paths/ci.yaml

  sync:
    if: ${{ needs.scope.result == 'success' && (needs.scope.outputs['sync'] == 'true') }}
    needs: ["scope"]
    name: Synchronize vendir content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vendir
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: false
          github_token: ${{ github.token }}

          add_shims_to_path: false
          install_args: --locked aqua:carvel-dev/vendir
      - name: Synchronize vendir content
        env:
          VENDIR_GITHUB_API_TOKEN: ${{ github.token }}
        run: vendir sync

  workflow-lint:
    if: ${{ needs.scope.result == 'success' && (needs.scope.outputs['workflow-lint'] == 'true') }}
    needs: ["scope"]
    uses: $/.github/workflows/workflow-lint.yaml
    permissions:
      contents: read
      checks: write
      pull-requests: write

  status:
    name: Build Success
    if: ${{ always() }}
    needs: ["scope", "sync", "workflow-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require every selected check
        uses: apeiros-innovations/common/.github/actions/ci-gate@089f4fcd7102868a7ca99e98985b5662a5a05251 # v2.0.0
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"scope": true, "sync": "${{ (needs.scope.outputs['sync'] == 'true') }}", "workflow-lint": "${{ (needs.scope.outputs['workflow-lint'] == 'true') }}"}
