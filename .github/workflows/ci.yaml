---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request: null
  push:
    branches:
      - main
  merge_group: null

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MISE_ENV: ci

jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        # Review pin; replace with the published Common release before merging.
        uses: apeiros-innovations/common/.github/actions/select-checks@d54f74ffaeb28f261c5d277c0af053453c225ef3
        with:
          policy: .github/ci-impact/ci.json

  sync:
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.selected || '{}')['sync'] }}
    needs: ["scope"]
    name: Synchronize vendir content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vendir
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          cache: false
          github_token: ${{ github.token }}

          add_shims_to_path: false
          install_args: --locked aqua:carvel-dev/vendir
      - name: Synchronize vendir content
        env:
          VENDIR_GITHUB_API_TOKEN: ${{ github.token }}
        run: vendir sync

  workflow-lint:
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.selected || '{}')['workflow-lint'] }}
    needs: ["scope"]
    uses: $/.github/workflows/workflow-lint.yaml
    permissions:
      contents: read
      checks: write
      pull-requests: write

  status:
    name: Build Success
    if: ${{ always() }}
    needs: ["scope", "sync", "workflow-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require every selected check
        uses: apeiros-innovations/common/.github/actions/ci-gate@4be80ca4e32b1478bca8780b479c14bdfca68400 # v1.1.1
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"scope": true, "sync": "${{ fromJSON(needs.scope.outputs.selected || '{}')['sync'] }}", "workflow-lint": "${{ fromJSON(needs.scope.outputs.selected || '{}')['workflow-lint'] }}"}
