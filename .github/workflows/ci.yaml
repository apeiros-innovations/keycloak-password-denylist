---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request: null
  push:
    branches:
      - main
  merge_group: null

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MISE_ENV: ci

jobs:
  sync:
    name: Synchronize vendir content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vendir
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550  # v5.2.2
        with:
          cache: false
          github_token: ${{ github.token }}

          add_shims_to_path: false
          install_args: --locked aqua:carvel-dev/vendir
      - name: Synchronize vendir content
        env:
          VENDIR_GITHUB_API_TOKEN: ${{ github.token }}
        run: vendir sync

  workflow-lint:
    uses: $/.github/workflows/workflow-lint.yaml
    permissions:
      contents: read
      checks: write
      pull-requests: write

  status:
    name: Build Success
    if: ${{ always() }}
    needs: ["sync", "workflow-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require every selected check
        uses: apeiros-innovations/common/.github/actions/ci-gate@cb121e644708aa003e4411492ed6ff33dbbbb68d  # main
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"sync": true, "workflow-lint": true}
