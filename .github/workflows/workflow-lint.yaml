---
name: Workflow quality
on:
  workflow_dispatch: {}
  workflow_call: null

permissions: {}
env:
  MISE_ENV: ci
concurrency:
  group: workflow-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      workflows: ${{ steps.baseline.outputs.full == 'true' || steps.filter.outputs.unclassified == 'true' || steps.filter.outputs['workflows'] == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check comparison history
        id: baseline
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          NEW_BRANCH: ${{ github.event.created || false }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          full=true
          if [[ "$EVENT" == pull_request || "$EVENT" == push || "$EVENT" == merge_group ]] &&
             [[ "$NEW_BRANCH" != true && "$REF" != refs/tags/* ]] &&
             [[ "$BASE" =~ ^[[:xdigit:]]{40}$ && "$HEAD_SHA" =~ ^[[:xdigit:]]{40}$ ]] &&
             git cat-file -e "$BASE^{commit}" && git cat-file -e "$HEAD_SHA^{commit}"; then
            if [[ "$EVENT" == pull_request ]]; then
              if git merge-base "$BASE" "$HEAD_SHA" >/dev/null; then full=false; fi
            elif git merge-base --is-ancestor "$BASE" "$HEAD_SHA"; then
              full=false
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Detect changed paths
        id: filter
        if: steps.baseline.outputs.full == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          predicate-quantifier: some-with-excludes
          filters: .github/paths/workflow-lint.yaml

  workflows:
    if: ${{ needs.scope.result == 'success' && (needs.scope.outputs['workflows'] == 'true') }}
    needs: ["scope"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Compare event commits locally; manual/scheduled runs retain full validation.
      # https://github.com/dorny/paths-filter#supported-workflows
      - name: Detect workflow changes
        id: actionlint-changes
        if: >-
          contains(fromJSON('["pull_request", "push", "merge_group"]'), github.event_name) &&
          (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '' &&
          (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            workflows:
              - '.github/workflows/**'
              - '**/action.{yaml,yml}'
              - '.github/actionlint.{yaml,yml}'
              - '.shellcheckrc'
              - '.mise/**'
              - '.miserc.toml'
      - name: Install ShellCheck archive support
        shell: bash
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xz-utils
          fi
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install: false
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false
      - name: Read tool versions from mise
        id: tool-versions
        shell: bash
        run: |
          versions=$(env -u MISE_ENABLE_TOOLS mise ls --current --json | jq -c 'map_values(.[0].version)')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
      - name: Set up Python for workflow checks
        if: steps.actionlint-changes.outputs.workflows != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ fromJSON(steps.tool-versions.outputs.versions)['python'] }}
      - name: Lint workflows with reviewdog
        if: steps.actionlint-changes.outputs.workflows != 'false'
        uses: reviewdog/action-actionlint/dockerless@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
      - name: Check shell scripts with reviewdog
        uses: reviewdog/action-shellcheck@950c9d71535c8c49e5c029c33a438ade63b9009c  # v1.35.1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
          check_all_files_with_shebangs: true
          pattern: |
            *.sh
            *.bash
            *.bats
          exclude: |
            */.git/*
            */node_modules/*
            */vendor/*
            */.venv/*
            */.mise/locks/*
            */_output/*
            */dist/*
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@a818f16177a5395fc11d3c73577caabaa7119391  # v0.9.1
        with:
          version: ${{ fromJSON(steps.tool-versions.outputs.versions)['aqua:zizmorcore/zizmor'] }}
          inputs: .github
          advanced-security: false
          annotations: true
